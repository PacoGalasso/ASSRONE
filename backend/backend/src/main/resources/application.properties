# Shared defaults for local dev. Real deployments MUST set SPRING_PROFILES_ACTIVE=production
# (see application-production.properties, RefreshCookieProperties, CorsProperties and
# ProductionSecurityGuard for the stricter overrides and startup-time checks that only
# apply under that profile). The test suite never depends on this file's app.jwt.secret/
# spring.mail.* values — see src/test/resources/application-local.properties.
spring.application.name=backend
# Flyway is the sole owner of the schema, in every environment, including a
# completely empty database: it always runs before Hibernate/JPA is built
# (Spring Boot's own default ordering — nothing in this project overrides it
# anymore). See LegacyBaselineFlywayCallback for how the handful of tables
# that predate Flyway's introduction to this project (users,
# membership_applications, events, documents) get created, in a way that is
# always a no-op on any database that already has them. Hibernate never
# creates or alters a single table or column, anywhere, ever — ddl-auto is
# always "validate", local and production alike.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.profiles.active=local
app.upload-dir=uploads
# No default on purpose: an absent/blank/malformed/wrong-length secret makes JwtService
# refuse to construct (see JwtService#buildSigningKey), in every profile, not just
# production — there is no environment where a missing signing key is acceptable.
#
# Token lifetimes (access: 30 minutes, refresh: 7 days) are intentionally NOT exposed as
# properties here: they are defined once, as JwtService#ACCESS_TOKEN_DURATION and
# #REFRESH_TOKEN_DURATION, and deliberately left untouched by this configuration-hardening
# lot to avoid changing anything about token issuance/lifetime behavior.
app.jwt.secret=${JWT_SECRET}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Local-dev default: Mailpit (see docker-compose.yml), not a real mail server —
# no credentials needed, nothing ever leaves this machine, and its web UI
# (http://localhost:8025 by default) lets a developer actually read the
# password-reset/email-verification links this application sends without
# ever depending on a real SMTP account. Real deployments override every one
# of these in application-production.properties, with no default there — see
# that file for why. Never used by the test suite either — see
# src/test/resources/application-local.properties, which points at a host
# nothing listens on so a test that forgets to mock JavaMailSender fails
# fast instead of silently reaching this local Mailpit instance.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:dev@assrone.local}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.contact.recipient=info@assrone.ch

# Applies to every profile, not just production: no client-facing error response should
# ever include a stack trace, exception class name, or binding-error detail — those stay
# server-side, in the logs, where GlobalExceptionHandler's own generic messages already
# demonstrate the pattern for the exceptions it catches. This makes the same behavior
# explicit for whatever it doesn't catch, rather than relying on Spring Boot's own
# (already-safe) defaults staying unchanged across versions.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Comma-separated list of IPs and/or CIDR ranges (e.g. 10.0.0.5,10.1.0.0/24) allowed to
# supply X-Forwarded-For for client IP resolution (see ClientIpResolver). Empty by default:
# X-Forwarded-For is ignored entirely and request.getRemoteAddr() is always used, which is
# correct for local dev and for the test suite (no reverse proxy in front of the app).
# In production, behind the HTTPS reverse proxy, set this to that proxy's real IP/CIDR via
# an environment variable (e.g. ${TRUSTED_PROXIES:}) — never leave it empty in production if
# a reverse proxy is in front of the app, and never set it to a wildcard/0.0.0.0/0-style range.
app.security.trusted-proxies=${TRUSTED_PROXIES:}

# Comma-separated list of origins allowed to make credentialed (cookie-bearing) cross-origin
# requests (see SecurityConfig#corsConfigurationSource). Defaults to the local Angular dev
# server. Never set this to "*" — CORS forbids combining a wildcard origin with
# allowCredentials(true) anyway, and Spring will reject it at startup. In production, set this
# via an environment variable to the real deployed frontend origin(s), comma-separated if there
# is more than one.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# HttpOnly cookie carrying the refresh token (see RefreshCookieFactory). Never accessible from
# JavaScript regardless of these settings (HttpOnly is not configurable — always true).
# - name: cosmetic only, must not look like it carries sensitive data.
# - secure: MUST be true wherever the app is served over HTTPS (i.e. any real deployment).
#   Defaults to false only so the cookie still works over plain HTTP on localhost in dev —
#   never set this to false in a production environment property file/variable.
# - same-site: Lax is sufficient here (see SecurityConfig / the auth lifecycle security
#   review) since /auth/refresh and /auth/logout are POST-only, and SameSite=Lax already
#   blocks the cookie on cross-site POST requests, not just Strict. Do not switch to None
#   unless the frontend and backend are genuinely deployed on different registrable domains
#   (not just different ports/subdomains), and only together with secure=true.
# - path: /auth, the narrowest path that still covers both /auth/refresh (must read the
#   cookie to rotate it) and /auth/logout (must read it to revoke, and must be able to issue
#   a matching Set-Cookie to delete it).
app.security.refresh-cookie.name=${REFRESH_COOKIE_NAME:refresh_token}
app.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.security.refresh-cookie.path=${REFRESH_COOKIE_PATH:/auth}

# Maximum number of concurrent active sessions a single account may hold (see SessionService).
# When a login would exceed this, the oldest active session is revoked to make room — see
# SessionProperties and the SESSION_LIMIT_ENFORCED audit event.
app.security.sessions.max-active=${SESSIONS_MAX_ACTIVE:5}
# Scheduled purge of sessions that no longer serve any purpose (see SessionCleanupService).
# Disabled in the test suite (src/test/resources/application-local.properties) so it never
# fires unpredictably mid-test. retention-after-expiry keeps a revoked/expired session's row
# (and its refresh tokens) around for a while after it stops being usable, so
# RefreshTokenService#rotate can still tell a legitimate revocation apart from real token
# reuse for that long.
app.security.sessions.cleanup.enabled=${SESSIONS_CLEANUP_ENABLED:true}
app.security.sessions.cleanup.cron=${SESSIONS_CLEANUP_CRON:0 0 3 * * *}
app.security.sessions.cleanup.retention-after-expiry=${SESSIONS_CLEANUP_RETENTION:7d}

# Base URL every password-reset/email-verification link is built from (see
# AccountLifecycleProperties, PasswordResetService, EmailVerificationService). Defaults to
# the local Angular dev server; production overrides this via an environment variable with
# no default (see application-production.properties) so it can never be forgotten there.
app.security.account-lifecycle.frontend-url=${ACCOUNT_LIFECYCLE_FRONTEND_URL:http://localhost:4200}
# How long a password-reset token stays usable after being emailed.
app.security.account-lifecycle.reset-token.expiry=${ACCOUNT_LIFECYCLE_RESET_TOKEN_EXPIRY:1h}
# How long an email-verification token stays usable (resend abuse limits are owned by
# RateLimitCategory.EMAIL_VERIFICATION_RESEND, see AccountLifecycleProperties).
app.security.account-lifecycle.verification-token.expiry=${ACCOUNT_LIFECYCLE_VERIFICATION_TOKEN_EXPIRY:24h}
# Scheduled purge of expired/used password-reset and email-verification tokens (see
# TokenCleanupService). Disabled in the test suite for the same reason session cleanup is.
app.security.account-lifecycle.cleanup.enabled=${ACCOUNT_LIFECYCLE_CLEANUP_ENABLED:true}
app.security.account-lifecycle.cleanup.cron=${ACCOUNT_LIFECYCLE_CLEANUP_CRON:0 30 3 * * *}
app.security.account-lifecycle.cleanup.retention-after-expiry=${ACCOUNT_LIFECYCLE_CLEANUP_RETENTION:7d}

# Whether the Content-Security-Policy (see ContentSecurityPolicy/SecurityConfig) tells the
# browser to silently rewrite any http: sub-resource request to https: before sending it.
# False here (the local/test default) so the plain-HTTP Angular dev server keeps working —
# forcing HTTPS locally would just break every request. Only meaningful, and only enabled, in
# production (see application-production.properties), which is HTTPS-only in the first place.
app.security.csp.upgrade-insecure-requests=${CSP_UPGRADE_INSECURE_REQUESTS:false}