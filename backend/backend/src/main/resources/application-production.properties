# Overrides applied only when SPRING_PROFILES_ACTIVE=production is set explicitly —
# this file is never loaded by local dev or by the test suite. See application.properties
# for the shared/local defaults and RefreshCookieProperties/CorsProperties/
# ProductionSecurityGuard for the startup-time checks that back these up.

# Same value as the base application.properties default (see there for the full
# rationale) — repeated here, hardcoded rather than via the JPA_DDL_AUTO variable that
# default resolves through, so production can never be talked into "update" by an
# operator setting that variable: "validate" only checks the already-migrated schema
# against the JPA mappings (fails loudly on drift) and never mutates anything.
spring.jpa.hibernate.ddl-auto=validate

# Real deployments are HTTPS-only: the refresh-token cookie must never be sent over
# plain HTTP. Still overridable via the environment variable (so an operator CAN still
# get this wrong), but ProductionSecurityGuard refuses to let the application start at
# all if the resolved value ends up false in this profile.
app.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}

# Deliberately no default here (unlike the base application.properties, which defaults
# to the local Angular dev server): production must not silently fall back to a
# meaningless origin list. Leaving CORS_ALLOWED_ORIGINS unset makes the application
# fail to start with a clear "could not resolve placeholder" error instead.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Production is HTTPS-only (see refresh-cookie.secure above), so upgrading any stray
# http: sub-resource reference to https: is always correct here — unlike in local dev,
# where the whole app is served over plain HTTP.
app.security.csp.upgrade-insecure-requests=${CSP_UPGRADE_INSECURE_REQUESTS:true}

# Every password-reset/email-verification link is built from this. Deliberately no
# default here either (see allowed-origins above): a production deployment that
# forgets to set ACCOUNT_LIFECYCLE_FRONTEND_URL must fail to start, not silently
# email members a link pointing at localhost.
app.security.account-lifecycle.frontend-url=${ACCOUNT_LIFECYCLE_FRONTEND_URL}

# Real SMTP delivery, explicit and required — the base application.properties'
# Mailpit-pointing defaults (see there) must never be reachable here even by
# accident: none of these five have a default in this file, so a deployment
# that forgets one fails to start with a clear "could not resolve placeholder"
# error rather than silently emailing password-reset links through nothing,
# or through an empty/anonymous connection. SMTP_AUTH/SMTP_STARTTLS are
# hardcoded true, not env-driven, on purpose: a real SMTP provider needs both,
# and there is no legitimate production reason to ever turn either off.
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
