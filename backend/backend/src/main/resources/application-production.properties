# Overrides applied only when SPRING_PROFILES_ACTIVE=production is set explicitly —
# this file is never loaded by local dev or by the test suite. See application.properties
# for the shared/local defaults and RefreshCookieProperties/CorsProperties/
# ProductionSecurityGuard for the startup-time checks that back these up.

# Flyway remains the sole schema owner in production: "validate" only checks the
# already-applied schema against the JPA mappings (fails loudly on drift) and never
# mutates anything, unlike "update" (the local/test default), which would otherwise
# be able to silently ALTER a production table outside of a reviewed migration.
spring.jpa.hibernate.ddl-auto=validate

# Real deployments are HTTPS-only: the refresh-token cookie must never be sent over
# plain HTTP. Still overridable via the environment variable (so an operator CAN still
# get this wrong), but ProductionSecurityGuard refuses to let the application start at
# all if the resolved value ends up false in this profile.
app.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}

# Deliberately no default here (unlike the base application.properties, which defaults
# to the local Angular dev server): production must not silently fall back to a
# meaningless origin list. Leaving CORS_ALLOWED_ORIGINS unset makes the application
# fail to start with a clear "could not resolve placeholder" error instead.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
