# Named "-local" — not because this is meant for a developer's machine, but because
# "local" is the profile every test in this module already inherits by default (see
# spring.profiles.active=local in src/main/resources/application.properties), and
# profile-specific files always layer on top of the base application.properties
# regardless of which classpath root they are found on. A bare, same-named
# application.properties placed here instead would NOT merge with the main one — it
# would silently replace it outright for every test in the module, which is not what
# we want. This file only ever exists on the test classpath, so despite its name it
# can never affect local dev (`mvn spring-boot:run`) or a packaged/production jar.
#
# Purpose: give every @SpringBootTest in this module (in particular the
# Testcontainers-backed ones that load the full application context) a safe,
# self-contained app.jwt.secret and spring.mail.* — so no test ever depends on a
# developer's local JWT_SECRET/SMTP_PASSWORD environment variables, and none of them
# can ever reach the real SMTP server even if a test forgets to mock JavaMailSender.
#
# A single test class can still override any of these via
# @SpringBootTest(properties = ...) or @DynamicPropertySource, which both take
# precedence over this file (see BackendApplicationTests for an example).

# 48 random bytes, Base64-encoded (HS384 key length required by JwtService). Test-only
# signing key — never used outside the test classpath, never used in local dev or production.
app.jwt.secret=zTjvaDrwlDQTMdHQ9vSfqXGwdkGSXJtT09uCOP+KLfO0RmyO617AZi/hK7VKCiKe

# Points at a host/port nothing is listening on: any test that triggers a real send
# without mocking JavaMailSender fails fast with a connection error instead of silently
# reaching the real production SMTP server (mail.infomaniak.com) with a real credential.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.invalid
spring.mail.password=test-password-not-real
