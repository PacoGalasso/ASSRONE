# Local development database only — never used in production. A real deployment
# provides its own managed/hosted PostgreSQL and points the backend at it via
# SPRING_DATASOURCE_URL/USERNAME/PASSWORD (see .env.example); nothing in this file
# is read by, or relevant to, a production deployment.
services:
  postgres:
    image: postgres:15
    container_name: postgres-assrone
    environment:
      # Overridable so a developer can pick a different local password; the
      # defaults below are only ever a throwaway local container, never a real
      # credential — see the file-level comment above.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-assrone_db}
    ports:
      # Host-side port only, so a backend running outside Docker (the normal local
      # dev setup here) and/or a local DB client can reach this container.
      - "5433:5432"
    volumes:
      # Named volume: persists data across `docker compose down`/`up` so a developer
      # doesn't lose local data between sessions. Remove with `docker compose down -v`.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assrone_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local development SMTP capture only — never used in production, and never
  # reached by the automated test suite either (see
  # src/test/resources/application-local.properties, which points at a host
  # nothing listens on so a test can never depend on this container being up).
  # application.properties' local defaults (spring.mail.host/port) already
  # point here with no authentication required. Open http://localhost:8025 to
  # read the password-reset/email-verification emails the running backend
  # sends — nothing ever leaves this machine.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-assrone
    ports:
      - "1025:1025" # SMTP — matches application.properties' local default port.
      - "8025:8025" # Web UI — open in a browser to read captured emails.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
