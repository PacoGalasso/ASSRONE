<div class="min-h-screen bg-blue-900 flex items-center justify-center px-4">
  <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-blue-900 mb-2 text-center">ASSRONE</h1>
    <p class="text-gray-600 text-center mb-8">Connectez-vous à votre compte</p>

    @if (errorMessage) {
      <div class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900"
          placeholder="votre@email.com"
        />
        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <p class="text-red-600 text-sm mt-1">Email valide requis</p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Mot de passe</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900"
          placeholder="Votre mot de passe"
        />
        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <p class="text-red-600 text-sm mt-1">Au moins 6 caractères</p>
        }
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading"
        class="w-full bg-blue-900 text-white py-2 rounded-lg font-semibold hover:bg-blue-800 disabled:opacity-50 transition"
      >
        @if (isLoading) {
          Connexion en cours...
        } @else {
          Se connecter
        }
      </button>
    </form>
  </div>
</div>
